<!doctype html>
<meta charset="utf-8">
<title>Safari LCP repro</title>
<body>
  <h1>LCP Test</h1>
  <div id="slot"></div>
  <p>Text below the image</p>
  <script>
    const params = new URLSearchParams(location.search);
    const delay = Number(params.get('delay') || 500);
    const variant = params.get('variant') || 'img';
    const src = () => `/img.png?delay=${delay}&t=${Date.now()}`;
    const slot = document.getElementById('slot');

    const lcpEntries = [];
    const describe = (e) => ({
      tag: e.element ? e.element.tagName : null,
      id: e.id,
      url: e.url,
      size: e.size,
      startTime: e.startTime,
      renderTime: e.renderTime,
      loadTime: e.loadTime,
      presentationTime: e.presentationTime ?? null,
    });
    new PerformanceObserver((list) => {
      for (const e of list.getEntries()) lcpEntries.push(describe(e));
    }).observe({type: 'largest-contentful-paint', buffered: true});

    // Per spec (LCP 4.1/4.2), trusted scroll or input events stop LCP reporting.
    // Record them (with timestamps) to rule that out.
    const stopEvents = [];
    for (const type of [
      'scroll', 'wheel', 'keydown', 'keyup', 'pointerdown', 'pointerup',
      'mousedown', 'mouseup', 'click', 'touchstart', 'focus', 'resize',
    ]) {
      addEventListener(type, (e) => {
        stopEvents.push({type, isTrusted: e.isTrusted, t: Math.round(performance.now())});
      }, {capture: true, passive: true});
      document.addEventListener(type, (e) => {
        stopEvents.push({type: `doc:${type}`, isTrusted: e.isTrusted, t: Math.round(performance.now())});
      }, {capture: true, passive: true});
    }

    // Count rendering updates to check that frames are really being produced.
    let rafCount = 0;
    (function tick() {
      rafCount++;
      requestAnimationFrame(tick);
    })();

    // Each variant puts a 300x300 image-ish thing on the page. All of them
    // should be a larger LCP candidate than the <h1>.
    let target; // the element we expect to become the LCP
    const variants = {
      // Same as the web-vitals fixture (plus explicit size).
      img() {
        target = document.createElement('img');
        target.width = target.height = 300;
        target.src = src();
        slot.append(target);
      },
      // The web-vitals fixture also sets elementtiming.
      'img-elementtiming'() {
        target = document.createElement('img');
        target.width = target.height = 300;
        target.setAttribute('elementtiming', 'main-image');
        target.src = src();
        slot.append(target);
      },
      // No width/height attributes: size comes only from the loaded image.
      'img-nosize'() {
        target = document.createElement('img');
        target.src = src();
        slot.append(target);
      },
      // Image decoded before being attached to the DOM.
      async 'img-decode-then-insert'() {
        target = new Image();
        target.src = src();
        await target.decode();
        slot.append(target);
      },
      // Inline-markup <img> parsed by the HTML parser (not created via DOM APIs).
      'img-parsed'() {
        slot.innerHTML = `<img width="300" height="300" src="${src()}">`;
        target = slot.firstElementChild;
      },
      // CSS background-image.
      bg() {
        target = document.createElement('div');
        target.style.cssText = `width:300px;height:300px;background:url(${src()})`;
        slot.append(target);
      },
      // SVG <image>.
      'svg-image'() {
        slot.innerHTML = `<svg width="300" height="300"><image width="300" height="300" href="${src()}"/></svg>`;
        target = slot.querySelector('image');
      },
      // Control: big text. Not image-related, should always be an LCP candidate.
      text() {
        target = document.createElement('p');
        target.style.cssText = 'font-size:60px';
        target.textContent = 'Big text';
        setTimeout(() => slot.append(target), delay);
      },
    };

    // Diagnostics: is the image really loaded, laid out and visible?
    const diagnose = () => {
      if (!target) return null;
      const r = target.getBoundingClientRect();
      const cs = getComputedStyle(target);
      return {
        tag: target.tagName,
        complete: target.complete ?? null,
        naturalWidth: target.naturalWidth ?? null,
        naturalHeight: target.naturalHeight ?? null,
        currentSrc: target.currentSrc ?? null,
        rect: {x: r.x, y: r.y, width: r.width, height: r.height},
        checkVisibility: target.checkVisibility?.() ?? null,
        display: cs.display,
        visibility: cs.visibility,
        opacity: cs.opacity,
        isConnected: target.isConnected,
        inViewport:
          r.bottom > 0 && r.right > 0 &&
          r.top < innerHeight && r.left < innerWidth,
      };
    };

    (async () => {
      await variants[variant]();
      // Wait for the load (delay) plus a couple of frames and a safety margin.
      await new Promise((r) => setTimeout(r, delay + 1500));
      await new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));
      // A brand-new observer with buffered:true: does the browser *have* more
      // entries than the original observer was told about?
      const freshTags = await new Promise((resolve) => {
        const po = new PerformanceObserver((list) => {
          resolve(list.getEntries().map((e) => e.element?.tagName ?? null));
          po.disconnect();
        });
        po.observe({type: 'largest-contentful-paint', buffered: true});
        setTimeout(() => resolve(null), 1000);
      });
      window.__result = {
        variant,
        stopEvents,
        rafCount,
        freshObserverTags: freshTags,
        paintEntries: performance.getEntriesByType('paint').map((e) => ({
          name: e.name,
          startTime: e.startTime,
        })),
        delay,
        userAgent: navigator.userAgent,
        environment: {
          visibilityState: document.visibilityState,
          hasFocus: document.hasFocus(),
          devicePixelRatio: devicePixelRatio,
          viewport: {width: innerWidth, height: innerHeight},
          screen: {width: screen.width, height: screen.height},
        },
        supportedEntryTypes: PerformanceObserver.supportedEntryTypes,
        target: diagnose(),
        // Resource Timing entry for the image: did it load at all?
        resource: performance
          .getEntriesByType('resource')
          .filter((e) => e.name.includes('/img.png'))
          .map((e) => ({
            name: e.name,
            startTime: e.startTime,
            responseEnd: e.responseEnd,
          })),
        lcpEntries,
      };
      window.__done = true;
    })();
  </script>
</body>
