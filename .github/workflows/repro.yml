name: Safari LCP repro
on:
  push:
  workflow_dispatch:
jobs:
  repro:
    strategy:
      fail-fast: false
      matrix:
        # Compare Safari versions across runner images.
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm install
      - name: Enable safaridriver
        run: sudo safaridriver --enable
      - name: Show Safari version
        run: defaults read /Applications/Safari.app/Contents/Info CFBundleShortVersionString
      - name: Show Safari / WebKit build details
        run: |
          set +e
          S=/Applications/Safari.app/Contents
          echo "== macOS =="; sw_vers; uname -m
          echo "== Safari Info.plist =="
          for k in CFBundleShortVersionString CFBundleVersion LSMinimumSystemVersion; do
            printf '%s = ' $k; defaults read $S/Info $k
          done
          echo "== Safari.app location / realpath =="
          ls -ld /Applications/Safari.app; readlink -f /Applications/Safari.app
          echo "== Frameworks bundled inside Safari.app =="
          ls $S/Frameworks 2>&1 | head -20
          echo "== System WebKit frameworks =="
          for f in /System/Library/Frameworks/WebKit.framework \
                   /System/Library/PrivateFrameworks/WebKitLegacy.framework \
                   /System/Library/Frameworks/JavaScriptCore.framework \
                   /System/Library/PrivateFrameworks/WebCore.framework; do
            printf '%s: ' "$f"
            defaults read "$f/Resources/Info" CFBundleVersion 2>&1 \
              || defaults read "$f/Versions/A/Resources/Info" CFBundleVersion 2>&1
          done
          echo "== Safari linked WebKit =="
          otool -L $S/MacOS/Safari 2>&1 | grep -iE "webkit|javascriptcore|webcore" | head
          echo "== safaridriver =="
          safaridriver --version 2>&1
          echo "== display =="
          system_profiler SPDisplaysDataType 2>&1 | head -25
      - name: Run repro
        run: npm run repro
  # Is it already fixed upstream? Same repro on Safari Technology Preview.
  repro-tp:
    name: repro on Safari Technology Preview (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm install
      - name: Install Safari Technology Preview
        run: brew install --cask safari-technology-preview
      - name: Show versions
        run: |
          set +e
          sw_vers
          STP="/Applications/Safari Technology Preview.app/Contents"
          for k in CFBundleShortVersionString CFBundleVersion LSMinimumSystemVersion; do
            printf '%s = ' $k; defaults read "$STP/Info" $k
          done
          ls "$STP/MacOS" | head
          "$STP/MacOS/safaridriver" --version
      - name: Enable safaridriver (stable and TP)
        run: |
          sudo safaridriver --enable
          sudo "/Applications/Safari Technology Preview.app/Contents/MacOS/safaridriver" --enable
      - name: Run repro on Safari Technology Preview
        run: BROWSER=safari-tp REPEAT=3 npm run repro
